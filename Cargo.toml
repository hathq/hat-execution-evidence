[package]
readme = "README.md"
repository = "https://github.com/hathq/hat-execution-evidence"
include = ["src/**", "tests/**", "schemas/**", "docs/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE*", "NOTICE*"]
exclude = ["/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "hat-execution-evidence"
version = "0.10.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Provider-owned durable HAT execution attestation and read-only evidence lookup"
publish = ["crates-io"]

[workspace]
members = ["."]
resolver = "3"

[features]
transport = ["dep:crowsi-transport-foundation", "dep:tokio", "zixcel-revision/redb"]

[[bin]]
name = "hat-evidence-lookup"
path = "src/bin/lookup.rs"
required-features = ["transport"]

[[bin]]
name = "hat-evidence-authority"
path = "src/bin/authority.rs"
required-features = ["transport"]

[dependencies]
hat-specifications = { version = "=0.10.0" }
zixcel-revision = { version = "=0.10.0", features = ["attestation"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std", "zeroize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
crowsi-transport-foundation = { version = "=0.10.0", features = ["async-io"], optional = true }
tokio = { version = "1", features = ["macros", "rt", "net", "signal", "time", "io-std"], optional = true }
zeroize = "1"

[dev-dependencies]
tempfile = "3.27.0"
zixcel-revision = { version = "=0.10.0", features = ["redb", "attestation"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
